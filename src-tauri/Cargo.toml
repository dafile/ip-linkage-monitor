[package]
name = "ip-linkage-monitor"
version = "1.4.0"
description = "掌上看家联动IP在线状态监控"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
winreg = "0.55"
rfd = "0.15"
winapi = { version = "0.3", features = [
    "winuser",
    "processthreadsapi",
    "handleapi",
    "winbase",
    "winnt",
    "psapi",
    "tlhelp32",
    "synchapi",
    "bluetoothapis",
    "sysinfoapi",
    "timezoneapi",
    "minwinbase",
] }
windows = { version = "0.58", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
] }

[profile.release]
strip = true
